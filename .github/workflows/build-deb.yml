name: Build tk local-file camera helper
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      THEOS: ${{ github.workspace }}/work/theos
      THEOS_COMMIT: 304e0799973e8145f32e4ca2de6c747a84b758ce
      SDKS_COMMIT: 0222fd5413cf4b9af096f37b4621afa2688572f7
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Locate complete local-file source
        id: layout
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import os, stat, zipfile
          root=Path.cwd().resolve()
          archives=[]
          for path in root.rglob('*.zip'):
              if any(x in {'.git','work','vendor','.theos'} for x in path.relative_to(root).parts):continue
              with zipfile.ZipFile(path) as z:
                  for name in z.namelist():
                      if PurePosixPath(name).name!='control' or z.getinfo(name).file_size>65536:continue
                      text=z.read(name).decode('utf-8','replace')
                      if 'Package: local.xiaoguai.tk.local\n' in text and 'Version: 0.1.0\n' in text:archives.append(path);break
          preferred=root/'tk-local-video-source-0.1.0.zip'
          archive=preferred if preferred in archives else archives[0] if len(archives)==1 else None
          if len(archives)>1 and archive is None:raise SystemExit('Keep one matching local-file source ZIP.')
          search=root
          if archive:
              destination=root/'work/local-source';destination.mkdir(parents=True,exist_ok=True)
              with zipfile.ZipFile(archive) as z:
                  for item in z.infolist():
                      path=PurePosixPath(item.filename)
                      if path.is_absolute() or '..' in path.parts or '\\' in item.filename or stat.S_ISLNK(item.external_attr>>16):raise SystemExit('Unsafe ZIP entry')
                      if not (destination/item.filename).resolve().is_relative_to(destination):raise SystemExit('ZIP escape')
                  z.extractall(destination)
              search=destination
          candidates=[p.parent for p in search.rglob('LocalPlayer.mm') if (p.parent/'control').is_file() and not any(x in {'.git','vendor','.theos'} for x in p.relative_to(search).parts)]
          if len(candidates)!=1:raise SystemExit('Upload the full local-file ZIP or one extracted source directory.')
          source=candidates[0]
          required=['Makefile','control','LocalPlayer.mm','LocalImport.mm','LocalFiles.mm','Client.m','Producer.mm','MediaBus.mm',
              'AppAudio.mm','SystemHooks.mm','Consumer.mm','AudioSample.mm','SandboxAccess.mm','LiveAudioStatus.mm',
              'controlapp/main.mm','controlapp/Makefile','controlapp/Info.plist','prefs/OBPrefs.m','prefs/Makefile',
              'core/LocalPlayback.hpp','core/RealtimeOwner.hpp','core/SharedMedia.hpp','core/AudioReadClock.hpp',
              'tests/local_pipeline_tests.cpp','tests/local_player_native_tests.mm','tests/fixtures/sample.mp4',
              'scripts/run_host_tests.py','scripts/run_native_local_tests.sh','scripts/prepare_packaging.py',
              'tests/check_project.py','tests/check_deb.py','tests/test_deb_checker.py','tests/test_packaging.py',
              'layout/DEBIAN/postinst','layout/Library/libSandy/local.xiaoguai.tk.local.media-read.plist',
              'layout/Library/libSandy/local.xiaoguai.tk.local.live-read.plist']
          missing=[n for n in required if not (source/n).is_file()]
          if missing:raise SystemExit('Missing files: '+', '.join(missing))
          if 'Package: local.xiaoguai.tk.local' not in (source/'control').read_text():raise SystemExit('Wrong source branch')
          for name in ['Makefile','control','prefs/Makefile','controlapp/Makefile','layout/DEBIAN/postinst']:
              path=source/name;data=path.read_bytes().removeprefix(b'\xef\xbb\xbf').replace(b'\r\n',b'\n').replace(b'\r',b'\n')
              path.write_bytes(data if data.endswith(b'\n') else data+b'\n')
          (source/'layout/DEBIAN/postinst').chmod(0o755)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('source_dir='+source.relative_to(root).as_posix()+'\n')
          PY
      - name: Portable core and packaging regressions
        working-directory: ${{ steps.layout.outputs.source_dir }}
        run: python3 scripts/run_host_tests.py
      - name: Native local MP4 playback, looping, PCM and stop
        working-directory: ${{ steps.layout.outputs.source_dir }}
        run: bash scripts/run_native_local_tests.sh
      - name: CoreMedia audio sample construction
        working-directory: ${{ steps.layout.outputs.source_dir }}
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk macosx --show-sdk-path)"
          xcrun --sdk macosx clang++ -std=c++17 -UNDEBUG -Wall -Wextra -Werror -O2 -fobjc-arc -fblocks \
            -isysroot "$SDK" AudioSample.mm tests/coremedia_audio_tests.mm \
            -framework Foundation -framework CoreMedia -framework AudioToolbox -o work/coremedia-audio-tests
          work/coremedia-audio-tests 2>&1 | tee work/coremedia-audio-test.log
      - name: Theos build tools
        run: |
          brew install make ldid
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Fixed Theos and iOS SDK
        working-directory: ${{ steps.layout.outputs.source_dir }}
        run: |
          git init "$THEOS"
          git -C "$THEOS" remote add origin https://github.com/theos/theos.git
          git -C "$THEOS" fetch --depth=1 origin "$THEOS_COMMIT"
          git -C "$THEOS" checkout --detach FETCH_HEAD
          git -C "$THEOS" submodule update --init --recursive --depth=1
          git init work/sdk-checkout
          git -C work/sdk-checkout remote add origin https://github.com/theos/sdks.git
          git -C work/sdk-checkout sparse-checkout init --cone
          git -C work/sdk-checkout sparse-checkout set iPhoneOS16.5.sdk
          git -C work/sdk-checkout fetch --depth=1 origin "$SDKS_COMMIT"
          git -C work/sdk-checkout checkout --detach FETCH_HEAD
          mkdir -p "$THEOS/sdks"
          cp -R work/sdk-checkout/iPhoneOS16.5.sdk "$THEOS/sdks/"
          python3 tests/test_packaging.py --dm-pl "$THEOS/vendor/dm.pl/dm.pl"
      - name: Compile, sign and check rootless package
        working-directory: ${{ steps.layout.outputs.source_dir }}
        run: |
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless TARGET=iphone:clang:16.5:15.0
          python3 tests/check_deb.py packages/*.deb
          printf 'Native AVFoundation local-file build; no FFmpeg dependency.\nTheos %s\nSDK %s\n' "$THEOS_COMMIT" "$SDKS_COMMIT" > packages/build-info.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tk-local-file-deb
          path: ${{ steps.layout.outputs.source_dir }}/packages/*.deb
          if-no-files-found: error
      - name: Build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tk-local-file-diagnostics
          path: |
            ${{ steps.layout.outputs.source_dir }}/work/host-tests/*.log
            ${{ steps.layout.outputs.source_dir }}/work/local-native-test.log
            ${{ steps.layout.outputs.source_dir }}/work/coremedia-audio-test.log
            ${{ steps.layout.outputs.source_dir }}/.theos/obj/
          if-no-files-found: ignore
